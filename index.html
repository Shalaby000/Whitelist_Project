<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>Whitelist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div id="loginBox">
      <div id="loginLogo">▶ whitelist</div>
      <input id="loginInput" type="password" placeholder="Enter password…" autocomplete="current-password" />
      <button id="loginBtn">Enter</button>
      <span id="loginError"></span>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <!-- HEADER -->
    <header id="header">
      <span class="logo">▶ whitelist</span>
      <button id="panicBtn" title="Hide screen (K)">⬜</button>
    </header>

    <!-- PLAYER -->
    <section id="playerSection" class="hidden">
      <div id="playerWrap">
        <audio id="audioPlayer" controls></audio>
      </div>
      <div id="nowPlaying">
        <span id="nowTitle"></span>
        <button id="closePlayer">✕</button>
      </div>
    </section>

    <!-- MAIN CONTENT -->
    <div id="content">

      <!-- ADD SECTION -->
      <div id="addSection">

        <!-- URL -->
        <div class="add-block">
          <p class="add-label">Paste audio URL</p>
          <div class="add-row">
            <input id="urlInput" type="text" placeholder="https://…" />
            <input id="titleInput" type="text" placeholder="Title (optional)" />
            <button id="addUrlBtn">Add</button>
          </div>
        </div>

        <div class="divider">or</div>

        <!-- UPLOAD -->
        <div class="add-block">
          <p class="add-label">Upload file</p>
          <div class="add-row">
            <label class="upload-label" for="fileInput">Choose file</label>
            <input id="fileInput" type="file" accept="audio/*" hidden />
            <span id="fileName">No file chosen</span>
          </div>
          <div id="progressWrap" class="hidden">
            <div id="progressBar"></div>
          </div>
          <span id="uploadStatus"></span>
          <button id="addFileBtn" style="display:none"></button>
        </div>

      </div>

      <!-- FILTERS -->
      <div id="filterRow">
        <div id="filterBtns">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="audio">Audio</button>
        </div>
        <button id="clearBtn" class="danger-btn">Clear library</button>
      </div>

      <!-- LIBRARY -->
      <div id="library"></div>
      <div id="empty">
        <p>Your library is empty.</p>
        <p class="sub">Upload a file or paste an audio URL above.</p>
      </div>

    </div>

  </div>

  <!-- PANIC OVERLAY -->
  <div id="panicOverlay"></div>

  <script src="app.js"></script>
</body>
</html>
