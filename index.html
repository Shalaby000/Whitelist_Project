<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>Whitelist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div id="loginBox">
      <div id="loginLogo">▶ whitelist</div>
      <input id="loginInput" type="password" placeholder="Enter password…" autocomplete="current-password" />
      <button id="loginBtn">Enter</button>
      <span id="loginError"></span>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <!-- HEADER -->
    <header id="header">
      <span class="logo">▶ whitelist</span>
      <div id="headerActions">
        <button id="searchToggleBtn" title="Search library">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="panicBtn" title="Hide screen (K)">⬜</button>
      </div>
    </header>

    <!-- SEARCH BAR (hidden by default) -->
    <div id="searchBar" class="hidden">
      <input id="searchQuery" type="text" placeholder="Search your library…" autocomplete="off" />
      <button id="searchClearBtn">✕</button>
    </div>

    <!-- PLAYER -->
    <section id="playerSection" class="hidden">
      <div id="playerInner">
        <div id="playerTop">
          <div id="playerMeta">
            <div id="nowTitle"></div>
          </div>
          <button id="closePlayer" title="Close">✕</button>
        </div>
        <audio id="audioPlayer" preload="metadata"></audio>
        <div id="playerControls">
          <button id="prevBtn" title="Previous">⏮</button>
          <button id="playPauseBtn" title="Play/Pause">▶</button>
          <button id="stopBtn" title="Stop">⏹</button>
          <button id="nextBtn" title="Next">⏭</button>
          <button id="shuffleBtn" title="Shuffle" class="ctrl-btn">⇄</button>
          <button id="repeatBtn" title="Repeat" class="ctrl-btn">↻</button>
        </div>
        <div id="volumeRow">
          <span id="volumeIcon">🔊</span>
          <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1" />
          <span id="volumeVal">100%</span>
        </div>
      </div>
    </section>

    <!-- MAIN CONTENT -->
    <div id="content">

      <!-- ADD SECTION -->
      <div id="addSection">

        <!-- URL -->
        <div class="add-block">
          <p class="add-label">Paste audio URL</p>
          <div class="add-row">
            <input id="urlInput" type="text" placeholder="https://…" />
            <input id="titleInput" type="text" placeholder="Title (optional)" />
            <button id="addUrlBtn">Add</button>
          </div>
        </div>

        <div class="divider">or</div>

        <!-- UPLOAD -->
        <div class="add-block">
          <p class="add-label">Upload files</p>
          <div class="add-row">
            <label class="upload-label" for="fileInput">Choose files</label>
            <input id="fileInput" type="file" accept="audio/*" multiple hidden />
            <span id="fileName">No files chosen</span>
          </div>
          <div id="uploadQueue"></div>
          <button id="addFileBtn" style="display:none"></button>
        </div>

      </div>

      <!-- FILTERS -->
      <div id="filterRow">
        <div id="filterBtns">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="audio">Audio</button>
        </div>
      </div>

      <!-- LIBRARY -->
      <div id="library"></div>
      <div id="empty">
        <p>Your library is empty.</p>
        <p class="sub">Upload a file or paste an audio URL above.</p>
      </div>

    </div>

  </div>

  <!-- DELETE CONFIRM MODAL -->
  <div id="deleteModal" class="hidden">
    <div id="deleteBox">
      <p id="deleteMsg"></p>
      <p id="deleteWarning">This action cannot be undone.</p>
      <div id="deleteActions">
        <button id="deleteCancelBtn">Cancel</button>
        <button id="deleteConfirmBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- PANIC OVERLAY -->
  <div id="panicOverlay"></div>

  <script src="app.js"></script>
</body>
</html>
